name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
      runs-on: ubuntu-latest
      # Disable optional deps in this job to avoid native optional binaries
      env:
        NPM_CONFIG_OPTIONAL: 'false'
jobs:
  build:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        - name: Install dependencies (no optional deps)
          run: |
            set -e
            npm ci

      - name: Install dependencies (safe)
        run: |
          set -e
          npm ci || (npm cache clean --force && npm install --no-optional)

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Run tests
        run: npm run test -- --run

      - name: Build
        run: npm run build
